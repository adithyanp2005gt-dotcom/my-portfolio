services:
  - type: web
    name: adithyan-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://adithyan-p-adhi-creations.vercel.app,http://localhost:5173,http://localhost:4173,http://localhost:3000"
      - key: PORTFOLIO_URL
        value: "https://adithyan-p-adhi-creations.vercel.app"
